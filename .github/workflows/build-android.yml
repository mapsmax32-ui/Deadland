name: Build DEADLAND Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare export
        run: |
          mkdir -p build
          mkdir -p ~/.config/godot
          godot --version
      - name: Import project
        run: godot --headless --editor --path . --quit
      - name: Export Android APK
        run: godot --headless --path . --export-debug "Android" build/DEADLAND.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEADLAND-Android-APK
          path: build/DEADLAND.apk
          if-no-files-found: error
          retention-days: 14
